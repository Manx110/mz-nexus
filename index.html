<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Engine Tools // MZ-Nexus Optimizer Suite</title>

    <!-- FIX: Link the external stylesheet. Previously missing, causing all CSS classes to be dead. -->
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <!--
        FIX (Sidebar): Removed inline 'overflow-y: hidden' which was overriding the
        CSS class rule '.sidebar { overflow-y: auto; }', preventing the plugin list
        from ever scrolling. Layout and positioning now fully handled by styles.css.
    -->
    <div class="sidebar">
        <div id="file-drop-target" class="drop-zone">
            Drag &amp; Drop <code>plugins.js</code> and plugin files here
            <div style="margin: 12px 0 4px 0; font-size: 0.8rem; color: #71717a;">— or —</div>
            <button id="btn-load-demo" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem; margin-top: 4px;">⚡ Load Demo Sandbox</button>
        </div>

        <div class="sidebar-label">Active Load Order</div>

        <ul id="sortable-plugin-stack" class="plugin-list">
            <li class="plugin-list-placeholder">
                Sandbox Waiting for Upload...
            </li>
        </ul>
    </div>

    <div class="main-content">

        <div class="top-bar">
            <div class="top-bar-brand">
                MZ-Nexus <span>// Engine Layout Suite [MZ Core]</span>
                <span style="color:#52525b; font-size:0.75rem; font-weight:normal; margin-left:16px;">by <a href="https://github.com/Manx110" target="_blank" style="color:#52525b; text-decoration:none;">Manx110</a></span>
            </div>
            <div class="top-bar-stats">
                <div class="stat-badge">
                    Active Plugins: <span id="total-count" style="color: #e4e4e7; font-weight: bold;">0</span>
                </div>
                <div class="stat-badge status-alert">
                    Conflicts: <span id="conflict-count" style="font-weight: bold;">0</span>
                </div>
            </div>
        </div>

        <!--
            FIX (Tabs): Removed inline 'border-bottom: 2px solid transparent' from each
            button. Inline styles have higher specificity than class styles, which meant
            the active tab underline from '.tab-btn.active' in the CSS was always overridden
            and never visible. Active state is now managed purely by the CSS class.
        -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="resolution">Resolution Center</button>
            <button class="tab-btn" data-tab="conflict-map">Conflict Map</button>
            <button class="tab-btn" data-tab="database">Database Audit</button>
        </div>

        <div id="active-view-panel" class="view-panel"></div>

        <div class="bottom-bar">
            <!-- Footer links now live inside the bottom bar so they can never overlap content -->
            <div class="footer-links">
                Found an anomaly?
                <a href="https://github.com/Manx110/mz-nexus/issues" target="_blank" class="link-issue">Report it on GitHub</a>
                <span class="divider">|</span>
                Support the tool:
                <a href="https://ko-fi.com/nexusenginetools" target="_blank" class="link-coffee">☕ Buy me a coffee</a>
            </div>
            <div class="bottom-bar-actions">
                <button id="btn-reset"    class="btn btn-reset"    disabled>Reset</button>
                <button id="btn-optimize" class="btn btn-secondary" disabled>Auto-Optimize Order</button>
                <button id="btn-export"   class="btn btn-primary"   disabled>Export Updated plugins.js</button>
            </div>
        </div>

    </div>

    <script src="parser.js"></script>
</body>
</html>
