<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Engine Tools // MZ-Nexus Optimizer Suite</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        /* Global Reset & Strict Dark Mode Visibility Defaults */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e0e11 !important;
            color: #e4e4e7 !important;
            overflow: hidden;
        }
        
        /* High-Visibility Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 40px;
            margin-top: 15vh;
            display: block !important;
        }
        .welcome-message h3 {
            color: #f4f4f5 !important;
            font-size: 1.8rem;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .welcome-message p {
            color: #a1a1aa !important;
            font-size: 1rem;
            line-height: 1.6;
            margin: 8px 0;
        }

        /* Interactive Drag & Drop Blue Highlight */
        .drop-zone-active {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.1) !important;
            color: #3b82f6 !important;
        }
        
        /* Alert Cards Architecture */
        .alert-card {
            background: #18181b !important;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .alert-card h4 {
            margin-top: 0;
            font-size: 1.1rem;
        }
        .alert-card p {
            color: #e4e4e7 !important;
            font-size: 0.95rem;
        }
        .alert-card .impact-text {
            color: #a1a1aa !important;
            background: #121214;
            padding: 12px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="sidebar" style="display: flex; flex-direction: column; width: 320px; background: #121214; border-right: 1px solid #2a2a30; padding: 20px; box-sizing: border-box; height: 100vh; position: fixed; top: 0; left: 0; overflow-y: hidden; z-index: 200;">
        <div id="file-drop-target" style="border: 2px dashed #3f3f46; border-radius: 8px; padding: 30px 20px; text-align: center; color: #a1a1aa; font-size: 0.9rem; margin-bottom: 20px; transition: all 0.2s ease;">
            Drag & Drop js/plugins.js and plugin files here
        </div>
        
        <div style="font-size: 0.8rem; font-weight: bold; color: #71717a; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px;">
            ACTIVE LOAD ORDER
        </div>
        
        <ul id="sortable-plugin-stack" style="list-style: none; padding: 0; margin: 0; flex-grow: 1; overflow-y: auto;">
            <li style="text-align: center; margin-top: 20px; color: #52525b; font-size: 0.85rem; border: 1px dashed #3f3f46; padding: 10px; border-radius: 6px;">
                Sandbox Waiting for Upload...
            </li>
        </ul>
    </div>

    <div class="main-content" style="margin-left: 320px; display: flex; flex-direction: column; height: 100vh; background: #0e0e11; position: relative;">
        
        <div class="top-bar" style="height: 60px; border-bottom: 1px solid #2a2a30; display: flex; align-items: center; justify-content: space-between; padding: 0 30px;">
            <div style="font-weight: bold; font-size: 1.1rem; color: #e4e4e7;">
                MZ-Nexus <span style="color: #71717a; font-weight: normal; font-size: 0.9rem; margin-left: 10px;">// Engine Layout Suite [MZ Core]</span>
            </div>
            <div style="display: flex; gap: 15px;">
                <div style="background: #1a1a1e; border: 1px solid #2a2a30; padding: 5px 12px; border-radius: 6px; font-size: 0.85rem; color: #a1a1aa;">
                    Active Plugins: <span id="total-count" style="color: #e4e4e7; font-weight: bold;">0</span>
                </div>
                <div style="background: #450a0a; border: 1px solid #7f1d1d; padding: 5px 12px; border-radius: 6px; font-size: 0.85rem; color: #f87171;">
                    Conflicts: <span id="conflict-count" style="font-weight: bold;">0</span>
                </div>
            </div>
        </div>

        <div class="tabs" style="display: flex; gap: 20px; padding: 20px 30px 0; border-bottom: 1px solid #2a2a30;">
            <button class="tab-btn active" data-tab="resolution" style="background: none; border: none; color: #a1a1aa; padding: 10px 0; cursor: pointer; font-size: 0.95rem; border-bottom: 2px solid transparent;">Resolution Center</button>
            <button class="tab-btn" data-tab="conflict-map" style="background: none; border: none; color: #a1a1aa; padding: 10px 0; cursor: pointer; font-size: 0.95rem; border-bottom: 2px solid transparent;">Conflict Map</button>
            <button class="tab-btn" data-tab="database" style="background: none; border: none; color: #a1a1aa; padding: 10px 0; cursor: pointer; font-size: 0.95rem; border-bottom: 2px solid transparent;">Database Audit</button>
        </div>

        <div id="active-view-panel" style="padding: 30px; flex-grow: 1; overflow-y: auto; padding-bottom: 120px;">
            </div>

        <div class="bottom-bar" style="padding: 20px 30px; border-top: 1px solid #2a2a30; display: flex; justify-content: flex-end; gap: 15px; background: #0e0e11; position: fixed; bottom: 0; right: 0; width: calc(100% - 320px); box-sizing: border-box; z-index: 100;">
            <button id="btn-optimize" style="padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; background: transparent; border: 1px solid #3f3f46; color: #e4e4e7;">Auto-Optimize Order</button>
            <button id="btn-export" style="padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; background: #3b82f6; color: white; border: none;">Export Updated plugins.js</button>
        </div>

        <div style="position: fixed; bottom: 28px; left: 350px; font-size: 0.85rem; color: #e4e4e7 !important; z-index: 110;">
            Found an anomaly? <a href="https://github.com/Manx110/mz-nexus/issues" target="_blank" style="color: #3b82f6 !important; text-decoration: none; font-weight: bold;">Report it on GitHub</a> 
            <span style="margin: 0 12px; color: #3f3f46;">|</span> 
            Support the tool: <a href="https://ko-fi.com/nexusenginetools" target="_blank" style="color: #10b981 !important; text-decoration: none; font-weight: bold;">☕ Buy me a coffee</a>
        </div>

    </div>

    <script src="parser.js"></script>
</body>
</html>
